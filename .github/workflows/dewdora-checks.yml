name: Dewdora checks
on:
  push:
    branches: [chatgpt/complete-dewdora]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan route:list --path=api/v1
      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && composer install --no-interaction --prefer-dist && cp .env.example .env && php artisan key:generate
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Run Laravel and Next production browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          export DB_CONNECTION=sqlite DB_DATABASE="$PWD/backend/database/acceptance.sqlite" CACHE_STORE=array SESSION_DRIVER=array APP_URL=http://127.0.0.1:8000
          touch "$DB_DATABASE"
          mkdir -p backend/storage/app/public/uploads/images
          cp frontend/public/dewdora-og.png backend/storage/app/public/uploads/images/test-product.png
          cd backend
          php artisan migrate:fresh --seed --force
          php artisan db:seed --class=RuntimeAcceptanceSeeder --force
          php artisan storage:link
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/dewdora-php.log 2>&1 & php_pid=$!
          cd ../frontend
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1 API_URL=http://127.0.0.1:8000/api/v1 NEXT_PUBLIC_STORAGE_URL=http://127.0.0.1:8000/storage
          npm run build
          npm run start -- -p 3000 -H 127.0.0.1 > /tmp/dewdora-next.log 2>&1 & next_pid=$!
          trap 'kill "$php_pid" "$next_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do if curl -fsS http://127.0.0.1:3000/products > /dev/null; then break; fi; sleep 1; done
          E2E_ADMIN_EMAIL=runtime@example.test E2E_ADMIN_PASSWORD='RuntimeTest!2026' npm test
          curl -fsS http://127.0.0.1:3000/products | grep -o '<meta[^>]*>' | grep 'og:title'
          curl -fsS http://127.0.0.1:3000/products/test-product-8 | grep -o '<meta[^>]*>' | grep 'og:image'
          curl -fsS http://127.0.0.1:3000/posts/test-review | grep -o '<meta[^>]*>' | grep 'og:type'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            frontend/test-results/
            /tmp/dewdora-php.log
            /tmp/dewdora-next.log
